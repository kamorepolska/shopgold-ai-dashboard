  <script>
  // Dynamic loader: fix sourcing.js duplicate blocks before eval
  (async function() {
    try {
      const resp = await fetch('/js/sourcing.js?v=20261023-2');
      let code = await resp.text();
      const lines = code.split('\n');

      // Find duplicate UTILITIES headers
      const utilHeaders = [];
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].indexOf('UTILITIES') !== -1 && lines[i].indexOf('resize') !== -1) {
          utilHeaders.push(i);
        }
      }

      if (utilHeaders.length >= 2) {
        // Remove the first (broken) copy: from utilHeaders[0]-1 to utilHeaders[1]-1
        const firstStart = utilHeaders[0] - 1;
        const secondStart = utilHeaders[1] - 1;
        const newLines = [...lines.slice(0, firstStart), '', ...lines.slice(secondStart)];
        
        // Also remove orphaned array elements between }; and const PROMO_COL_DEFS
        const finalLines = [];
        let skipOrphans = false;
        for (let i = 0; i < newLines.length; i++) {
          const trimmed = newLines[i].trim();
          if (skipOrphans) {
            if (trimmed === '];') { skipOrphans = false; continue; }
            if (trimmed.indexOf("{ key:'") === 0 || trimmed === '') continue;
            skipOrphans = false;
          }
          if (trimmed === '};' && i + 1 < newLines.length) {
            const next = (newLines[i+1] || '').trim();
            if (next.indexOf("{ key:'") === 0) { skipOrphans = true; finalLines.push(newLines[i]); continue; }
          }
          finalLines.push(newLines[i]);
        }
        code = finalLines.join('\n');
        console.log('[sourcing.js] Fixed: removed', lines.length - finalLines.length, 'duplicate lines');
      }

      // Evaluate the fixed code via dynamic script element (global scope)
      const script = document.createElement('script');
      script.textContent = code;
      document.head.appendChild(script);
      console.log('[sourcing.js] Loaded successfully');
    } catch(e) {
      console.error('[sourcing.js] Load error:', e);
    }
  })();
  </script>
